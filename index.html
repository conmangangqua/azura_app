<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Azura Hub - Premium App Center</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #22d3ee;
      --primary-glow: rgba(34, 211, 238, 0.4);
      --secondary: #14b8a6;
      --bg-dark: #050811;
      --card-bg: rgba(15, 23, 42, 0.6);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-shine: rgba(255, 255, 255, 0.03);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.6;
    }

    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: var(--bg-dark);
      overflow: hidden;
    }

    .blob {
      position: absolute;
      width: 600px;
      height: 600px;
      background: var(--primary);
      filter: blur(150px);
      border-radius: 50%;
      opacity: 0.15;
      animation: drift 25s infinite alternate ease-in-out;
    }

    .blob-2 {
      background: var(--secondary);
      width: 500px;
      height: 500px;
      right: -10%;
      top: 10%;
      animation-duration: 18s;
      animation-delay: -7s;
    }

    @keyframes drift {
      from { transform: translate(-5%, -5%) scale(1); }
      to { transform: translate(15%, 20%) scale(1.15); }
    }

    header {
      padding: 80px 20px 20px;
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
    }

    header h1 {
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      margin-bottom: 16px;
      background: linear-gradient(to bottom, #fff, var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
      font-weight: 500;
    }

    .search-section {
      max-width: 500px;
      margin: 40px auto 30px;
      padding: 0 20px;
      position: sticky;
      top: 20px;
      z-index: 100;
    }

    .search-wrapper {
      position: relative;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 2px;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .search-wrapper:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 20px var(--primary-glow);
    }

    .search-wrapper input {
      width: 100%;
      background: transparent;
      border: none;
      padding: 14px 20px 14px 45px;
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      outline: none;
    }

    .search-wrapper::before {
      content: '🔍';
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.9rem;
      opacity: 0.6;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      padding: 20px 40px 80px;
    }

    #appContainer {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }

    .app-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .app-card:hover {
      transform: translateY(-10px) scale(1.02);
      border-color: rgba(34, 211, 238, 0.4);
      background: rgba(15, 23, 42, 0.8);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 30px var(--primary-glow);
    }

    .app-icon-box {
      width: 84px;
      height: 84px;
      margin: 0 auto 20px;
      position: relative;
    }

    .app-icon {
      width: 100%;
      height: 100%;
      border-radius: 20px;
      object-fit: cover;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--glass-border);
      transition: transform 0.3s ease;
    }

    .app-card:hover .app-icon {
      transform: scale(1.1) rotate(2deg);
    }

    .badge-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .badge {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge.android { background: rgba(61, 220, 132, 0.1); color: #3ddc84; border: 1px solid rgba(61, 220, 132, 0.2); }
    .badge.ios { background: rgba(0, 122, 255, 0.1); color: #007aff; border: 1px solid rgba(0, 122, 255, 0.2); }

    .app-title {
      font-size: 1.4rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
      color: #fff;
    }

    .app-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 24px;
      flex-grow: 1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.8em;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn {
      padding: 14px 8px;
      border-radius: 18px;
      font-weight: 700;
      font-size: 0.85rem;
      text-decoration: none;
      text-align: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:active { transform: scale(0.95); }

    .btn-dev { background: rgba(245, 158, 11, 0.1); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.2); }
    .btn-dev:hover { background: #f59e0b; color: #fff; box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }

    .btn-live { background:  rgba(34, 197, 94, 0.1); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.2); }
    .btn-live:hover { background: #22c55e; color: #fff; box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }

    .btn-wide { grid-column: span 2; background: rgba(255, 255, 255, 0.03); color: #fff; border: 1px solid var(--glass-border); }
    .btn-wide:hover { background: var(--primary); color: #000; box-shadow: 0 0 20px var(--primary-glow); }

    footer {
      padding: 60px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--glass-border);
      background: rgba(15, 23, 42, 0.2);
    }

    .app-card {
      opacity: 0;
      transform: translateY(30px);
      animation: reveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes reveal { to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 768px) {
      main { padding: 20px; }
      #appContainer { grid-template-columns: 1fr; }
      header h1 { font-size: 3rem; }
    }
  </style>
</head>
<body>
  <div class="bg-animation">
    <div class="blob"></div>
    <div class="blob blob-2"></div>
  </div>

  <header>
    <h1>Azura Hub</h1>
    <p>Trải nghiệm hệ sinh thái ứng dụng nội bộ chuẩn Azura Platinum</p>
  </header>

  <section class="search-section">
    <div class="search-wrapper">
      <input type="text" id="searchInput" placeholder="Tìm kiếm ứng dụng..." oninput="filterApps()">
    </div>
  </section>

  <main>
    <div id="appContainer"></div>
  </main>

  <footer>
    <p>&copy; 2026 Azura Hub. Powered by Platinum Engine.</p>
    <p>Premium distribution for internal testing.</p>
  </footer>

  <script>
    let allApps = [];

    const formatUrl = (url, isIOS) => {
      if (!url) return "";
      if (isIOS) return "itms-services://?action=download-manifest&url=" + encodeURIComponent(url);
      return url;
    };

    const renderApps = (apps) => {
      const container = document.getElementById("appContainer");
      container.innerHTML = "";

      if (apps.length === 0) {
        container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">Không tìm thấy ứng dụng nào khớp với từ khóa.</div>';
        return;
      }

      apps.forEach((app, index) => {
        const isIOS = (app.platform || "").toLowerCase().includes("ios");
        const devUrl = formatUrl(app.downloads?.dev, isIOS);
        const prodUrl = formatUrl(app.downloads?.prod, isIOS);
        const aabUrl = app.downloads?.aab || "";

        const card = document.createElement("article");
        card.className = "app-card";
        card.style.animationDelay = `${index * 0.05}s`;
        
        card.innerHTML = `
          <div class="app-icon-box">
             <img src="${app.icon || 'https://via.placeholder.com/150'}" class="app-icon" alt="${app.name}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(app.name)}&background=22d3ee&color=000'">
          </div>
          <div class="badge-row">
            <span class="badge ${isIOS ? 'ios' : 'android'}">${app.platform || 'Android'}</span>
          </div>
          <h2 class="app-title">${app.name}</h2>
          <p class="app-desc">${app.description || 'Hệ sinh thái ứng dụng chuẩn Azura.'}</p>
          <div class="btn-grid">
            ${devUrl ? `<a href="${devUrl}" class="btn btn-dev">🔧 Dev</a>` : ""}
            ${prodUrl ? `<a href="${prodUrl}" class="btn btn-live">🚀 Live</a>` : ""}
            ${aabUrl ? `<a href="${aabUrl}" class="btn btn-btn-wide">📦 Tải AAB</a>` : ""}
          </div>
        `;
        container.appendChild(card);
      });
    };

    const filterApps = () => {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = allApps.filter(app => 
         app.name.toLowerCase().includes(query) || 
         (app.description && app.description.toLowerCase().includes(query))
      );
      renderApps(filtered);
    };

    fetch("apps.json")
      .then(res => res.json())
      .then(data => {
        allApps = data.apps || [];
        renderApps(allApps);
      })
      .catch(err => {
        document.getElementById("appContainer").innerHTML = '<div style="color: #ef4444; text-align: center; grid-column: 1/-1;">❌ Lỗi kết nối dữ liệu.</div>';
      });
  </script>
</body>
</html>
